services:
  - type: web
    name: warrior-fitness-api
    runtime: node
    plan: free
    branch: develop
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NOTIFICATION_SCHEDULER_ENABLED
        value: "false"
      - key: DEMO_PUBLIC_LOGIN_ENABLED
        value: "false"
